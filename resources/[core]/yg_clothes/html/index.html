<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:transparent;color:white}#panel{display:none;position:absolute;right:3%;top:6%;width:380px;max-height:88vh;overflow:auto;background:#111216f5;border:1px solid #a72738;border-radius:14px;box-shadow:0 0 40px #000a;padding:22px}h1{font-size:23px;margin:0;color:#f44a60}p{font-size:12px;color:#aaa}section{border-bottom:1px solid #333;padding:11px 0}label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}.controls{display:flex;gap:8px;align-items:center}button{background:#292a30;color:#fff;border:1px solid #444;border-radius:6px;padding:8px 12px;cursor:pointer}button:hover{background:#a72738}.value{min-width:45px;text-align:center}footer{display:flex;gap:10px;position:sticky;bottom:-22px;background:#111216;padding:14px 0}footer button{flex:1}#save{background:#a72738;border-color:#e44}</style></head><body><div id="panel"><h1>YAKUZA - GG</h1><p>PERSONALIZACJA POSTACI • /skin</p><main id="items"></main><footer><button id="close">Zamknij</button><button id="save">Zapisz wygląd</button></footer></div><script>
const panel=document.getElementById('panel'),root=document.getElementById('items');let items=[];
async function call(name,data={}){const r=await fetch('https://'+GetParentResourceName()+'/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return r.json()}
function render(){root.innerHTML='';for(const s of items){const sec=document.createElement('section');const label=document.createElement('label');label.textContent=s.name;sec.append(label);const row=document.createElement('div');row.className='controls';const minus=document.createElement('button'),plus=document.createElement('button'),num=document.createElement('span');minus.textContent='−';plus.textContent='+';num.className='value';num.textContent=s.value+' / '+s.max;minus.onclick=()=>change(s,Math.max(s.min,s.value-1),0);plus.onclick=()=>change(s,Math.min(s.max,s.value+1),0);row.append(minus,num,plus);if(s.kind==='component'||s.kind==='prop'){const tex=document.createElement('button');tex.textContent='Kolor +';tex.onclick=()=>change(s,s.value,s.texture+1);row.append(tex)}sec.append(row);root.append(sec)}}
async function change(s,v,t){const r=await call('change',{id:s.id,value:v,texture:t});if(r.items){items=r.items;render()}}
window.addEventListener('message',e=>{if(e.data.action==='open'){items=e.data.items;panel.style.display='block';render()}if(e.data.action==='close')panel.style.display='none'});
document.getElementById('save').onclick=()=>call('save');
document.getElementById('close').onclick=()=>call('close');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.style.display==='block')call('close')});
</script></body></html>
